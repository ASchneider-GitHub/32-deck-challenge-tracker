<!doctype html>
<html lang="en" data-base="{{BASE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>32 Deck Challenge Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;800&display=swap" rel="stylesheet">
  <link href="{{BASE}}/static/style.css" rel="stylesheet">
  <script src="{{BASE}}/static/theme.js"></script>
</head>
<body>
  <div class="corner">
  <button type="button" class="theme-toggle" id="theme-toggle" role="switch"
          aria-checked="false" aria-label="Dark mode">
    <span class="theme-name" id="theme-name">Light mode</span>
    <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
    <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <aside class="last-login" id="last-login" aria-label="Last login" hidden></aside>
  </div>
  <main class="page">
    <h1><a href="{{BASE}}/">32 Deck Challenge Tracker</a></h1>
    <nav class="topnav">
      <a href="{{BASE}}/">Home</a>
      <a href="{{BASE}}/board">Leaderboard</a>
      <a href="{{BASE}}/recover">Recover Edit Link</a>
    </nav>
    <div id="app"></div>
  </main>
  <button type="button" class="to-top" id="to-top" aria-label="Jump to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <script src="{{BASE}}/static/app.js"></script>
</body>
</html>
