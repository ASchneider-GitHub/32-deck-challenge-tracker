# Put this in /etc/nginx/sites-available/deck32, then symlink into sites-enabled.
# Replace decks.example.com with your domain, then run certbot for HTTPS.

# Limit creation of new lists to 5/minute per IP (spam protection).
limit_req_zone $binary_remote_addr zone=deck32_create:10m rate=5r/m;
# Limit passphrase guesses to 10/minute per IP (the app also locks a username
# for 15 minutes after 5 wrong passphrases).
limit_req_zone $binary_remote_addr zone=deck32_recover:10m rate=10r/m;
# General API limit.
limit_req_zone $binary_remote_addr zone=deck32_api:10m rate=10r/s;

server {
    listen 80;
    server_name decks.example.com;

    client_max_body_size 64k;

    # Don't write secret edit tokens into the access log.
    location /e/ {
        access_log off;
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
    location /api/edit/ {
        access_log off;
        limit_req zone=deck32_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
    location = /api/recover {
        limit_req zone=deck32_recover burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
    location = /api/lists {
        limit_req zone=deck32_create burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
    location /api/ {
        limit_req zone=deck32_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
    location /static/ {
        alias /opt/deck32/static/;
        expires 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8032;
        include /etc/nginx/proxy_params;
    }
}
